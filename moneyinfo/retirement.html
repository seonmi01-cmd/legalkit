<!DOCTYPE html>
<html lang="ko" data-base="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/main.js"></script>
<script>
  MoneyInfo.injectHeader('retirement.html');
  MoneyInfo.injectTicker();
</script>

<div class="intro-section">
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">홈</a>
      <span class="breadcrumb-sep">›</span>
      <span class="current" style="color:#5c6b7a">노후·가족</span>
    </nav>
    <h1 class="intro-title">노후·가족</h1>
    <p class="intro-desc">국민연금·건강보험·상속증여·장기요양 등 노후 준비와 가족 금융 정보를 알기 쉽게 정리합니다.</p>
    <div class="popular-chips" style="margin-top:4px">
      <span class="topic-chip chip" data-topic="전체">전체</span>
      <span class="topic-chip chip" data-topic="국민연금">국민연금</span>
      <span class="topic-chip chip" data-topic="건강보험">건강보험</span>
      <span class="topic-chip chip" data-topic="상속·증여">상속·증여</span>
      <span class="topic-chip chip" data-topic="돌봄">돌봄</span>
    </div>
  </div>
</div>

<section class="content-section">
  <div class="container">
    <div id="featured-wrap"></div>
    <p class="articles-hd">최신 글</p>
    <div class="articles-grid" id="rest-grid"></div>
    <div class="load-more-wrap"><button class="load-more-btn">글 더보기</button></div>
    <div style="display:none" aria-hidden="true">
      <article data-topic="국민연금" data-date="2026.06.21" data-readtime="5분"
        data-title="국민연금 예상 수령액 조회법과 임의가입 전략"
        data-excerpt="가입 기간을 늘려 수령액을 높이는 현실적인 방법을 정리했습니다."></article>
      <article data-topic="건강보험" data-date="2026.06.20" data-readtime="5분"
        data-title="피부양자 자격 박탈 기준, 2026년 소득·재산 요건"
        data-excerpt="탈락 시 지역가입자 보험료 부담과 대비 방법을 설명합니다."></article>
      <article data-topic="상속·증여" data-date="2026.06.19" data-readtime="6분"
        data-title="사전증여 10년 합산, 세금 줄이는 증여 타이밍"
        data-excerpt="증여재산 공제 한도와 분산 증여 전략을 예시로 정리했습니다."></article>
      <article data-topic="돌봄" data-date="2026.06.18" data-readtime="4분"
        data-title="노인장기요양보험 등급 신청 절차와 본인부담금"
        data-excerpt="신청부터 등급 판정, 재가·시설 급여 차이를 짚었습니다."></article>
      <article data-topic="국민연금" data-date="2026.06.17" data-readtime="5분"
        data-title="연기연금 vs 조기연금, 손익분기점은 몇 살?"
        data-excerpt="수령 시기별 증감률과 총수령액 비교로 선택을 돕습니다."></article>
      <article data-topic="건강보험" data-date="2026.06.16" data-readtime="5분"
        data-title="건강보험료 지역가입자 부과 체계, 줄이는 방법"
        data-excerpt="소득·재산·자동차 기준과 조정 신청 방법을 정리했습니다."></article>
    </div>
  </div>
</section>

<script>
(function() {
  const ACCENT = '#5c6b7a';
  const ACCENT_BG = '#eef1f4';

  function buildFeatured(a) {
    return `<div class="featured-card" style="cursor:pointer">
      <div class="featured-meta">
        <span class="badge-new" style="background:${ACCENT}">최신</span>
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h2 class="featured-title">${a.title}</h2>
      <p class="featured-excerpt">${a.excerpt}</p>
      <p class="article-byline">${a.readtime} 읽기 · 머니인포 편집팀</p>
    </div>`;
  }

  function buildCard(a) {
    return `<div class="article-card" style="cursor:pointer">
      <div class="article-card-meta">
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h3 class="article-title">${a.title}</h3>
      <p class="article-excerpt">${a.excerpt}</p>
      <p class="article-read">${a.readtime} 읽기</p>
    </div>`;
  }

  const rawArticles = Array.from(document.querySelectorAll('[data-title]')).map(el => ({
    topic: el.dataset.topic, date: el.dataset.date, readtime: el.dataset.readtime,
    title: el.dataset.title, excerpt: el.dataset.excerpt,
  }));

  function render(topic) {
    const filtered = topic === '전체' ? rawArticles : rawArticles.filter(a => a.topic === topic);
    if (!filtered.length) return;
    document.getElementById('featured-wrap').innerHTML = buildFeatured(filtered[0]);
    document.getElementById('rest-grid').innerHTML = filtered.slice(1).map(buildCard).join('');
    document.querySelectorAll('.topic-chip').forEach(c => {
      const isActive = c.dataset.topic === topic;
      c.style.color = isActive ? ACCENT : '';
      c.style.background = isActive ? ACCENT_BG : '';
      c.style.borderColor = isActive ? ACCENT : '';
    });
  }

  document.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', () => render(chip.dataset.topic));
  });
  render('전체');
})();
</script>
<script>MoneyInfo.injectFooter();</script>
</body>
</html>
