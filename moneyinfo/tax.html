  </div>

<script>
(function() {
  const ACCENT = '#11243a';
  const ACCENT_BG = '#eef1f5';

  function buildFeatured(a) {
    return `<div class="featured-card" style="cursor:pointer">
      <div class="featured-meta">
        <span class="badge-new" style="background:${ACCENT}">최신</span>
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h2 class="featured-title">${a.title}</h2>
      <p class="featured-excerpt">${a.excerpt}</p>
      <p class="article-byline">${a.readtime} 읽기 · 머니인포 편집팀</p>
    </div>`;
  }

  function buildCard(a) {
    return `<div class="article-card" style="cursor:pointer">
      <div class="article-card-meta">
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h3 class="article-title">${a.title}</h3>
      <p class="article-excerpt">${a.excerpt}</p>
      <p class="article-read">${a.readtime} 읽기</p>
    </div>`;
  }

  const rawArticles = Array.from(document.querySelectorAll('[data-title]')).map(el => ({
    topic: el.dataset.topic, date: el.dataset.date, readtime: el.dataset.readtime,
    title: el.dataset.title, excerpt: el.dataset.excerpt,
  }));

  function render(topic) {
    const filtered = topic === '전체' ? rawArticles : rawArticles.filter(a => a.topic === topic);
    if (!filtered.length) return;
    document.getElementById('featured-wrap').innerHTML = buildFeatured(filtered[0]);
    document.getElementById('rest-grid').innerHTML = filtered.slice(1).map(buildCard).join('');
    document.querySelectorAll('.topic-chip').forEach(c => {
      const isActive = c.dataset.topic === topic;
      c.style.color = isActive ? ACCENT : '';
      c.style.background = isActive ? ACCENT_BG : '';
      c.style.borderColor = isActive ? ACCENT : '';
    });
  }

  document.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', () => render(chip.dataset.topic));
  });
  render('전체');
})();
</script>
<script>MoneyInfo.injectFooter();</script>
</body>
</html>
