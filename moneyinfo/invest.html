<!DOCTYPE html>
<html lang="ko" data-base="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재테크 — 머니인포</title>
  <meta name="description" content="예적금·투자·연금·금리 재테크 최신 정보. 절세 투자와 고금리 특판 정보를 놓치지 마세요.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<script src="js/main.js"></script>
<script>
  MoneyInfo.injectHeader('invest.html');
  MoneyInfo.injectTicker();
</script>

<div class="intro-section">
  <div class="container">
    <nav class="breadcrumb">
      <a href="index.html">홈</a>
      <span class="breadcrumb-sep">›</span>
      <span class="current" style="color:#a8761a">재테크</span>
    </nav>
    <h1 class="intro-title">재테크</h1>
    <p class="intro-desc">예적금 특판·절세 투자·연금 전략·금리 동향까지. 돈을 더 잘 불리는 재테크 정보를 정리합니다.</p>
    <div class="popular-chips" style="margin-top:4px">
      <span class="topic-chip chip" data-topic="전체">전체</span>
      <span class="topic-chip chip" data-topic="예적금">예적금</span>
      <span class="topic-chip chip" data-topic="투자">투자</span>
      <span class="topic-chip chip" data-topic="연금">연금</span>
      <span class="topic-chip chip" data-topic="금리">금리</span>
    </div>
  </div>
</div>

<section class="content-section">
  <div class="container">
    <div id="featured-wrap"></div>
    <p class="articles-hd">최신 글</p>
    <div class="articles-grid" id="rest-grid"></div>
    <div class="load-more-wrap"><button class="load-more-btn">글 더보기</button></div>
    <div style="display:none" aria-hidden="true">
      <article data-topic="예적금" data-date="2026.06.21" data-readtime="4분"
        data-title="6월 셋째 주 예금금리 비교 — 연 4%대 특판 어디에"
        data-excerpt="주요 은행·저축은행 특판 상품을 금리와 조건 기준으로 비교했습니다."></article>
      <article data-topic="투자" data-date="2026.06.20" data-readtime="6분"
        data-title="ISA·IRP 한 번에 이해하는 절세 투자 3단계"
        data-excerpt="계좌 개설부터 상품 선택, 세액공제까지 순서대로 정리했습니다."></article>
      <article data-topic="금리" data-date="2026.06.19" data-readtime="4분"
        data-title="기준금리 동결, 대출·예금 금리는 어디로 가나"
        data-excerpt="시장 전망과 변동·고정금리 선택 기준을 짚었습니다."></article>
      <article data-topic="연금" data-date="2026.06.18" data-readtime="5분"
        data-title="연금저축 세액공제 한도 900만원, 연말 전 채우는 법"
        data-excerpt="IRP 합산 한도와 추가 납입 전략, 환급 효과를 계산했습니다."></article>
      <article data-topic="투자" data-date="2026.06.17" data-readtime="5분"
        data-title="해외주식 양도세 250만원 공제, 매도 타이밍 전략"
        data-excerpt="연말 손익 통산과 분할 매도로 세금 줄이는 방법입니다."></article>
      <article data-topic="예적금" data-date="2026.06.16" data-readtime="4분"
        data-title="파킹통장 금리 비교, 단기 자금 어디에 둘까"
        data-excerpt="수시입출 가능한 고금리 통장과 한도·우대 조건을 비교했습니다."></article>
    </div>
  </div>
</section>

<script>
(function() {
  const ACCENT = '#a8761a';
  const ACCENT_BG = '#f8f1e2';

  function buildFeatured(a) {
    return `<div class="featured-card" style="cursor:pointer">
      <div class="featured-meta">
        <span class="badge-new" style="background:${ACCENT}">최신</span>
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h2 class="featured-title">${a.title}</h2>
      <p class="featured-excerpt">${a.excerpt}</p>
      <p class="article-byline">${a.readtime} 읽기 · 머니인포 편집팀</p>
    </div>`;
  }

  function buildCard(a) {
    return `<div class="article-card" style="cursor:pointer">
      <div class="article-card-meta">
        <span class="topic-pill" style="color:${ACCENT};background:${ACCENT_BG}">${a.topic}</span>
        <span class="article-date">${a.date}</span>
      </div>
      <h3 class="article-title">${a.title}</h3>
      <p class="article-excerpt">${a.excerpt}</p>
      <p class="article-read">${a.readtime} 읽기</p>
    </div>`;
  }

  const rawArticles = Array.from(document.querySelectorAll('[data-title]')).map(el => ({
    topic: el.dataset.topic, date: el.dataset.date, readtime: el.dataset.readtime,
    title: el.dataset.title, excerpt: el.dataset.excerpt,
  }));

  function render(topic) {
    const filtered = topic === '전체' ? rawArticles : rawArticles.filter(a => a.topic === topic);
    if (!filtered.length) return;
    document.getElementById('featured-wrap').innerHTML = buildFeatured(filtered[0]);
    document.getElementById('rest-grid').innerHTML = filtered.slice(1).map(buildCard).join('');
    document.querySelectorAll('.topic-chip').forEach(c => {
      const isActive = c.dataset.topic === topic;
      c.style.color = isActive ? ACCENT : '';
      c.style.background = isActive ? ACCENT_BG : '';
      c.style.borderColor = isActive ? ACCENT : '';
    });
  }

  document.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', () => render(chip.dataset.topic));
  });
  render('전체');
})();
</script>
<script>MoneyInfo.injectFooter();</script>
</body>
</html>
